# Development database for CloudBuddy (D-005, D-035).
services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudbuddy-postgres
    environment:
      POSTGRES_USER: cloudbuddy
      POSTGRES_PASSWORD: cloudbuddy
      POSTGRES_DB: cloudbuddy
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cloudbuddy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbuddy"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  cloudbuddy-pg:
