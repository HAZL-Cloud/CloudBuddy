<title>CloudBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a three-panel workbench. Saved runs on the left, the chat with the agent in the middle,
   and a dotted-grid canvas where each step lands left to right in a lane for its provider. */
:root{
  --bg:#EDF0F4; --panel:#FAFBFC; --canvas:#E5E9EF; --grid:#C3CBD6; --card:#FFFFFF; --card-muted:#F5F6F8; --code-bg:#F3F5F8;
  --ink:#141C27; --ink-2:#465365; --ink-3:#778396; --line:#D3D9E2; --line-soft:#E4E8EE; --edge:#97A3B3;
  --accent:#2350C8; --accent-soft:#E1E8FA; --accent-ring:rgba(35,80,200,.22); --on-accent:#FFFFFF;
  --read:#5B6A7D; --read-soft:#E5E9EF;
  --create:#16794B; --create-soft:#D9EFE2;
  --change:#9A5B00; --change-soft:#F7E7CB;
  --send:#9C2F86; --send-soft:#F6DDF0;
  --delete:#C0322A; --delete-soft:#FADFDB; --delete-ring:rgba(192,50,42,.2); --on-delete:#FFFFFF;
  --lane:rgba(255,255,255,.5); --scrim:rgba(12,18,28,.38);
  --shadow:0 1px 2px rgba(18,28,45,.06),0 6px 16px -8px rgba(18,28,45,.16);
  --shadow-lift:0 2px 4px rgba(18,28,45,.08),0 16px 36px -12px rgba(18,28,45,.28);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1318; --panel:#141920; --canvas:#0B0E12; --grid:#2A323D; --card:#181E26; --card-muted:#141920; --code-bg:#0F1419;
    --ink:#E6EAF0; --ink-2:#AAB4C2; --ink-3:#768397; --line:#28303B; --line-soft:#1E252E; --edge:#4E5A6A;
    --accent:#8CA6FF; --accent-soft:#1C2645; --accent-ring:rgba(140,166,255,.28); --on-accent:#0A1230;
    --read:#A3AFBE; --read-soft:#222A35;
    --create:#52C98D; --create-soft:#12301F;
    --change:#F0AE45; --change-soft:#35270E;
    --send:#F08AD6; --send-soft:#3A1633;
    --delete:#FF7D70; --delete-soft:#3A1714; --delete-ring:rgba(255,125,112,.22); --on-delete:#230806;
    --lane:rgba(255,255,255,.022); --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 18px -8px rgba(0,0,0,.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1318; --panel:#141920; --canvas:#0B0E12; --grid:#2A323D; --card:#181E26; --card-muted:#141920; --code-bg:#0F1419;
  --ink:#E6EAF0; --ink-2:#AAB4C2; --ink-3:#768397; --line:#28303B; --line-soft:#1E252E; --edge:#4E5A6A;
  --accent:#8CA6FF; --accent-soft:#1C2645; --accent-ring:rgba(140,166,255,.28); --on-accent:#0A1230;
  --read:#A3AFBE; --read-soft:#222A35;
  --create:#52C98D; --create-soft:#12301F;
  --change:#F0AE45; --change-soft:#35270E;
  --send:#F08AD6; --send-soft:#3A1633;
  --delete:#FF7D70; --delete-soft:#3A1714; --delete-ring:rgba(255,125,112,.22); --on-delete:#230806;
  --lane:rgba(255,255,255,.022); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 18px -8px rgba(0,0,0,.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.ic{width:16px;height:16px;flex:none}
.ic.sm{width:13px;height:13px}
code{font:500 .88em var(--f-mono);background:var(--line-soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* Action colors, applied by class on rows, cards, chips and ticks */
.risk-read{--risk:var(--read);--risk-soft:var(--read-soft)}
.risk-create{--risk:var(--create);--risk-soft:var(--create-soft)}
.risk-change{--risk:var(--change);--risk-soft:var(--change-soft)}
.risk-send{--risk:var(--send);--risk-soft:var(--send-soft)}
.risk-delete{--risk:var(--delete);--risk-soft:var(--delete-soft)}
.risk-result{--risk:var(--accent);--risk-soft:var(--accent-soft)}

.app{height:100%;display:grid;grid-template-columns:244px minmax(320px,384px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.mobile-switch{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}

/* ---------- Sidebar ---------- */
.sidebar{display:flex;flex-direction:column;gap:16px;padding:16px 12px 14px;border-right:1px solid var(--line);background:var(--bg);min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand-mark .ic{width:18px;height:18px}
.brand-name{font:700 19px/1 var(--f-display);letter-spacing:-.015em}
.brand-host{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.new-chat{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-weight:500;cursor:pointer}
.new-chat:hover{border-color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--ink-2);cursor:pointer}
.nav-item:hover{background:var(--line-soft);color:var(--ink)}
.nav-item.on{background:var(--line-soft);color:var(--ink);font-weight:500}
.badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--delete);color:var(--on-delete);font:600 11px/18px var(--f-body);text-align:center}
.badge.quiet{background:var(--line);color:var(--ink-2)}
.side-label{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:0 10px;margin-bottom:-8px}
.recents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.recent{width:100%;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer}
.recent:hover{background:var(--line-soft)}
.recent.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.recent-title{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.recent-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-width:0}
.recent-sub span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-sub.wait{color:var(--delete);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--create)}
.dot.wait{background:var(--delete);animation:pulse 1.6s ease-in-out infinite}
.dot.run{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.runtimes{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-2)}
.runtimes .side-label{padding:0;margin:0 0 2px}
.runtime{display:flex;align-items:center;gap:8px}
.runtime .mono{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.reset{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:0;border:0;background:none;color:var(--ink-3);font-size:12px;cursor:pointer}
.reset:hover{color:var(--ink)}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.chat-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.chat-head-main{min-width:0}
.chat-head h1{margin:0;font:600 16px/1.3 var(--f-display);letter-spacing:-.005em;text-wrap:balance}
.chat-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.meta-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--line-soft);color:var(--ink-2);font-size:12px}
.meta-chip.mono{font-size:11.5px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.menu-btn{display:none}
.messages{flex:1;min-height:0;overflow:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:14px}
.msg-user{align-self:flex-end;max-width:88%;padding:10px 13px;border-radius:14px 14px 4px 14px;background:var(--accent-soft);color:var(--ink);line-height:1.5}
.msg-agent{display:flex;flex-direction:column;gap:6px;line-height:1.55;min-width:0}
.msg-agent p{margin:0}
.agent-name{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2)}
.agent-av{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 9.5px var(--f-mono)}
.step-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.step-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 11px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left;cursor:pointer;font-size:13px}
.step-row:first-child{border-top:0}
.step-row:hover{background:var(--line-soft)}
.step-row .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-row.st-denied .rt{text-decoration:line-through;color:var(--ink-3)}
.step-row .rm{font:500 11px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rk{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--risk-soft);color:var(--risk)}
.rk .ic{width:12px;height:12px}
.approval{border:1.5px solid var(--delete);border-radius:12px;background:var(--card);overflow:hidden}
.ap-head{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--delete);color:var(--on-delete);font:600 11.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.ap-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:9px}
.ap-title{font-weight:600}
.ap-why{font-size:12.5px;color:var(--ink-2)}
.ap-cmd{font:12px/1.5 var(--f-mono);color:var(--ink-2);background:var(--code-bg);padding:7px 9px;border-radius:7px;overflow-wrap:anywhere;white-space:pre-wrap}
.ap-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ap-actions .btn.link{margin-right:auto}
.approval.done{border-color:var(--line)}
.approval.done .ap-head{background:var(--line-soft);color:var(--ink-2)}
.ap-result{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.ap-result.ok{color:var(--create)}
.ap-result.no{color:var(--ink-2)}
.working{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.composer{margin:6px 16px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 10px 8px 12px;display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{border:0;outline:0;resize:none;background:transparent;font:14px/1.45 var(--f-body);color:var(--ink);min-height:40px;width:100%}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:var(--panel)}
.chip.safe{color:var(--create);border-color:transparent;background:var(--create-soft);font-weight:500}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}

/* ---------- Canvas panel ---------- */
.canvas-panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.canvas-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.canvas-title{display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:auto}
.canvas-title b{font:700 16px/1.2 var(--f-display);letter-spacing:-.01em}
.canvas-title span{font-size:12px;color:var(--ink-3)}
.tally{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:999px;background:var(--risk-soft);color:var(--risk);font:600 12px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .ic{width:12px;height:12px}
.pill.waiting{box-shadow:inset 0 0 0 1.5px var(--delete)}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--line-soft);gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
.zoom button{border:0;background:none;height:30px;min-width:30px;padding:0 7px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.zoom button:hover{background:var(--line-soft);color:var(--ink)}
.zl{font:500 12px var(--f-mono);min-width:44px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}

.viewport{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background-color:var(--canvas);background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.4px)}
.viewport.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.lane{position:absolute;left:0;border-bottom:1px dashed var(--line)}
.lane.a{background:var(--lane)}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges .e{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .3s}
.edges .e.gate{stroke:var(--delete);stroke-dasharray:5 5}
.edges .e.flow{stroke:var(--accent);stroke-width:2}
.edges .e.extra{stroke-dasharray:2 5;stroke-linecap:round}
.edges .e.fut{opacity:.12}
.edges .ah{fill:var(--edge)}
.edges .ahg{fill:var(--delete)}
.edges .ahf{fill:var(--accent)}
.rail{position:absolute;left:0;top:0;width:0;height:100%;pointer-events:none;z-index:2}
.rail-l{position:absolute;left:0;top:0;display:flex;align-items:baseline;gap:7px;padding:5px 11px 5px 16px;background:var(--panel);border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .2s}
.rail-l b{font:700 13.5px/1.1 var(--f-display)}
.rail-l span{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.legend{position:absolute;right:16px;bottom:12px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:11.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:8px;pointer-events:none}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:20px;height:0;border-top:2px solid var(--edge)}
.lg i.flow{border-top-color:var(--accent)}
.lg-hint{color:var(--ink-3)}

/* Step cards */
.card{position:absolute;width:244px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:opacity .3s,box-shadow .2s,border-color .2s,filter .3s}
.card:hover{box-shadow:var(--shadow-lift)}
.card.selected,.card.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring),var(--shadow-lift)}
.card.future{opacity:.14;filter:grayscale(1)}
.card.enter{animation:cardIn .5s cubic-bezier(.2,.7,.2,1)}
.card-top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.card-top .time{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}
.risk{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;border-radius:999px;background:var(--risk-soft);color:var(--risk);font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.risk .ic{width:12px;height:12px}
.card-title{font:600 14.5px/1.3 var(--f-body);text-wrap:balance}
.card-res{font:12px/1.4 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;border-radius:5px;border:1px solid var(--line);font:600 11px var(--f-body);color:var(--ink-2);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag-live{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tag-irreversible{color:var(--delete);border-color:var(--delete)}
.tag-money{color:var(--create);border-color:var(--create)}
.tag-people{color:var(--send);border-color:var(--send)}
.uses{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--accent);line-height:1.35}
.uses .ic{margin-top:1px}
.generic{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:6px;background:var(--read-soft);font-size:11.5px;line-height:1.35;color:var(--ink-2)}
.generic .ic{margin-top:1px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:12px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.card-foot{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
.card-foot .api{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3);font-size:11px}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap}
.status.ok{color:var(--create)}
.status.run{color:var(--accent)}
.status.wait{color:var(--delete)}
.status.no{color:var(--ink-2)}
.card.st-denied{background:var(--card-muted)}
.card.st-denied .card-title{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.card.gate.st-waiting{border:1.5px solid var(--delete);animation:gatePulse 2.2s ease-in-out infinite}
.gate-banner{display:flex;align-items:center;gap:6px;margin:-12px -14px 0;padding:8px 14px;background:var(--delete);color:var(--on-delete);font:600 12px var(--f-body);border-radius:8px 8px 0 0}
.loss{border-radius:8px;background:var(--delete-soft);padding:8px 10px}
.loss-h{font:600 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--delete);margin-bottom:4px}
.loss ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column;gap:2px}
.why{font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.why span{display:block;font:600 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.gate-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stamp{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-mono);letter-spacing:.02em;padding:3px 8px;border-radius:5px;border:1.5px solid currentColor;transform:rotate(-1.5deg)}
.stamp.ok{color:var(--create)}
.stamp.no{color:var(--ink-2)}

/* ---------- Rendering ---------- */
function statusHTML(s){
  if (s.status === 'done') return `<span class="status ok">${ic('check','sm')}Done · ${s.dur}</span>`;
  if (s.status === 'running') return `<span class="status run"><span class="spin"></span>Running…</span>`;
  if (s.status === 'waiting') return `<span class="status wait">${ic('clock','sm')}Waiting since ${s.time}</span>`;
  return `<span class="status no">${ic('x','sm')}Not run</span>`;
}
const factsHTML = facts => `<dl class="facts">${facts.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
const tagsHTML = s => s.tags && s.tags.length ? `<div class="tags">${s.tags.map(t => `<span class="tag tag-${t}">${ic(TAG[t].icon)}${TAG[t].label}</span>`).join('')}</div>` : '';
function usesHTML(c, s){
  if (!s.uses) return '';
  return s.uses.map(u => {
    const n = c.steps.findIndex(x => x.id === u.from) + 1;
    return `<div class="uses">${ic('link','sm')}<span>Uses the ${esc(u.what)} from step ${n}</span></div>`;
  }).join('');
}
function stampHTML(s){
  if (!s.approval) return '';
  return s.approval.d === 'approve'
    ? `<span class="stamp ok">${ic('check','sm')}Approved by you · ${s.approval.at}</span>`
    : `<span class="stamp no">${ic('x','sm')}You said no · ${s.approval.at}</span>`;
}
function gateButtons(s){
  return `<div class="gate-actions"><button type="button" class="btn" data-act="deny" data-id="${s.id}">${esc(s.noLabel || 'No')}</button><button type="button" class="btn danger" data-act="approve" data-id="${s.id}">${esc(s.yesLabel || 'Approve')}</button></div>`;
}
function cardHTML(c, s, idx){
  const r = RISK[s.risk];
  const cls = ['card', 'risk-' + s.risk, 'st-' + s.status, s.gate ? 'gate' : '', state.seen.has(s.id) ? '' : 'enter'].join(' ');
  let h = `<div class="${cls}" data-id="${s.id}" tabindex="0" aria-label="Step ${idx+1}: ${esc(s.title)}">`;
  if (s.gate && s.status === 'waiting') h += `<div class="gate-banner">${ic('hand','sm')}Waiting for your approval</div>`;
  h += `<div class="card-top"><span class="risk">${ic(r.icon)}${r.label}</span><span>Step ${idx+1}</span><span class="time mono">${s.time}</span></div>`;
  h += `<div class="card-title">${esc(s.title)}</div><div class="card-res">${esc(s.res)}</div>`;
  h += tagsHTML(s);
  if (s.generic) h += `<div class="generic">${ic('question','sm')}<span>No ${esc(PROV[s.prov].name)} adapter. Guessed from the word “${esc(s.guessWord)}”.</span></div>`;
  h += usesHTML(c, s);
  if (s.facts && s.facts.length) h += factsHTML(s.facts);
  if (s.gate && s.status === 'waiting'){
    h += `<div class="loss"><div class="loss-h">${esc(s.lossTitle || 'What will be lost')}</div><ul>${s.loss.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
    h += `<div class="why"><span>Agent's reason</span>${esc(s.why)}</div>`;
    h += gateButtons(s);
  } else if (s.approval){
    h += stampHTML(s);
  }
  if (s.status === 'running') h += '<div class="bar"></div>';
  h += `<div class="card-foot">${statusHTML(s)}<span class="api mono" title="${esc(s.api)}">${esc(s.api)}</span></div></div>`;
  return h;
}
function counts(c){
  const n = {read:0, create:0, change:0, send:0, delete:0, denied:0};
  c.steps.forEach(s => { if (s.status === 'denied') n.denied++; else n[s.risk]++; });
  return n;
}
function resultHTML(c){
  const n = counts(c);
  const cells = [['Created', n.create], ['Changed', n.change]];
  if (n.send) cells.push(['Sent', n.send]);
  if (n.delete || !n.send) cells.push(['Deleted', n.delete]);
  cells.push(['Stopped by you', n.denied]);
  return `<div class="card result risk-result ${state.seen.has('result') ? '' : 'enter'}" data-id="result" aria-label="Run finished">
    <div class="card-top"><span class="risk">${ic('check')}Finished</span><span class="time mono">${c.result.at}</span></div>
    <div class="card-title">${esc(c.result.title)}</div><div class="card-res">${esc(c.result.line)}</div>
    <div class="tallies">${cells.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
  </div>`;
}
function edgePath(a, b){
  const x1 = a.x + CW, y1 = a.y + ANCHOR, x2 = b.x - 2, y2 = b.y + ANCHOR;
  if (Math.abs(y1 - y2) < 1) return `M${x1} ${y1} L${x2} ${y2}`;
  const mx = (x1 + x2) / 2;
  return `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}
function flowPath(a, b){
  const sx = a.x + CW / 2, sy = a.y + a.h, tx = b.x - 2, ty = b.y + ANCHOR + 22;
  return `M${sx} ${sy} C${sx} ${sy + 80}, ${tx - 90} ${ty}, ${tx} ${ty}`;
}
function laneInfo(c){
  const multi = new Set(c.steps.map(s => s.prov)).size > 1;
  return {
    key: s => multi ? s.prov : s.svc,
    label: id => multi ? {name:PROV[id].name, sub:PROV[id].via} : (SVC[id] || {name:id, sub:''})
  };
}

function renderCanvas(){
  const c = cur();
  if (!el.viewport.clientWidth){ state.dirty = true; return; }
  state.dirty = false;
  const all = c.steps;
  const steps = state.filter === 'changes' ? all.filter(s => s.risk !== 'read') : all;
  const L = laneInfo(c);
  const laneIds = [...new Set(steps.map(L.key))];
  el.nodes.innerHTML = steps.map(s => cardHTML(c, s, all.indexOf(s))).join('') + (c.result ? resultHTML(c) : '');
  const els = {};
  el.nodes.querySelectorAll('.card').forEach(n => { els[n.dataset.id] = n; });
  const laneH = laneIds.map(l => Math.max(MIN_CARD, ...steps.filter(s => L.key(s) === l).map(s => els[s.id].offsetHeight)) + PAD_T + PAD_B);
  const tops = []; let y = 0;
  laneH.forEach((h, i) => { tops[i] = y; y += h; });
  const pos = {};
  steps.forEach((s, i) => {
    const x = X0 + i * (CW + GX), top = tops[laneIds.indexOf(L.key(s))] + PAD_T, n = els[s.id];
    n.style.left = x + 'px'; n.style.top = top + 'px';
    pos[s.id] = {x, y:top, h:n.offsetHeight, idx:all.indexOf(s)};
  });
  let W = X0 + steps.length * (CW + GX);
  if (c.result){
    const n = els.result;
    n.style.left = W + 'px'; n.style.top = PAD_T + 'px';
    pos.result = {x:W, y:PAD_T, h:n.offsetHeight, idx:all.length};
    W += CW + GX;
  }
  W = W - GX + 80;
  const H = Math.max(y, c.result ? pos.result.h + PAD_T + PAD_B : 0);
  Object.assign(state, {pos, worldW:W, worldH:H});
  el.world.style.width = W + 'px'; el.world.style.height = H + 'px';
  el.lanes.innerHTML = laneIds.map((l, i) => `<div class="lane ${i % 2 === 0 ? 'a' : ''}" style="top:${tops[i]}px;height:${laneH[i]}px;width:${W}px"></div>`).join('');
  state.lanes = laneIds.map((l, i) => ({id:l, top:tops[i], h:laneH[i]}));
  el.rail.innerHTML = state.lanes.map(ln => { const lb = L.label(ln.id); return `<div class="rail-l"><b>${esc(lb.name)}</b><span>${esc(lb.sub)}</span></div>`; }).join('');
  const seq = steps.map(s => s.id);
  if (c.result) seq.push('result');
  let eh = '';
  for (let i = 0; i < seq.length - 1; i++){
    const a = pos[seq[i]], b = pos[seq[i+1]];
    const to = all.find(s => s.id === seq[i+1]);
    const gate = to && to.status === 'waiting';
    const flow = to && to.uses && to.uses.some(u => u.from === seq[i]);
    const cls = gate ? ' gate' : flow ? ' flow' : '';
    eh += `<path class="e${cls}" data-to="${b.idx}" d="${edgePath(a, b)}" marker-end="url(#${gate ? 'ahg' : flow ? 'ahf' : 'ah'})"/>`;
  }
  steps.forEach(s => (s.uses || []).forEach(u => {
    const ia = seq.indexOf(u.from), ib = seq.indexOf(s.id);
    if (ia < 0 || ib - ia === 1) return;
    eh += `<path class="e flow extra" data-to="${pos[s.id].idx}" d="${flowPath(pos[u.from], pos[s.id])}" marker-end="url(#ahf)"/>`;
  }));
  el.edges.setAttribute('width', W); el.edges.setAttribute('height', H);
  el.edgeG.innerHTML = eh;
  all.forEach(s => state.seen.add(s.id));
  if (c.result) state.seen.add('result');
  applyClasses();
  applyTransform();
}

function applyClasses(){
  const c = cur(), vi = state.viewIndex;
  el.nodes.querySelectorAll('.card').forEach(n => {
    const id = n.dataset.id;
    const idx = id === 'result' ? c.steps.length : c.steps.findIndex(s => s.id === id);
    n.classList.toggle('selected', id === state.selected);

}

function applyTransform(){
  const {zoom:z, panX:x, panY:y} = state;
  el.world.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
  el.viewport.style.backgroundSize = `${22*z}px ${22*z}px`;
  el.viewport.style.backgroundPosition = `${x}px ${y}px`;
  el.zoomLabel.textContent = Math.round(z * 100) + '%';
  const labels = el.rail.children;
  state.lanes.forEach((ln, i) => {
    const n = labels[i]; if (!n) return;
    const top = y + ln.top * z, bottom = y + (ln.top + ln.h) * z;
    n.style.transform = `translateY(${clamp(top + 10, 10, bottom - 40)}px)`;
    n.style.opacity = (bottom - top < 44 || bottom < 40) ? 0 : 1;
  });
}

function renderChat(){

  el.ticks.innerHTML = c.steps.map((s, i) => `<button type="button" class="tick risk-${s.risk} st-${s.status}${i <= vi ? ' on' : ''}${state.viewIndex !== null && i === vi ? ' cur' : ''}" data-i="${i}" title="Step ${i+1} · ${esc(s.title)}" aria-label="Go to step ${i+1}: ${esc(s.title)}"></button>`).join('');
  el.scrubLabel.innerHTML = `Step ${vi+1} of ${n}<span class="long"> · ${c.steps[vi].time}</span>`;
  el.liveBtn.hidden = state.viewIndex === null;
  el.playBtn.innerHTML = state.playing ? ic('pause') + '<span>Pause</span>' : ic('play') + '<span>Replay</span>';
  el.playBtn.setAttribute('aria-label', state.playing ? 'Pause replay' : 'Replay all steps');
}
const sec = (title, body, extra='', cls='') => `<section class="ins-sec ${cls}"><h4><span>${title}</span>${extra}</h4>${body}</section>`;
function renderInspector(){
  const c = cur(), s = c.steps.find(x => x.id === state.selected);
  if (!s){ state.selected = null; el.inspector.hidden = true; return; }
  const i = c.steps.indexOf(s), r = RISK[s.risk];
  const mcp = s.via === 'MCP';
  let h = `<div class="ins-head risk-${s.risk}"><span class="risk">${ic(r.icon)}${r.label}</span><span>Step ${i+1} · ${s.time}</span><button type="button" class="icon-btn" data-act="close" aria-label="Close details">${ic('x')}</button></div>`;
  h += `<h3 class="ins-title">${esc(s.title)}</h3><div class="ins-where">${esc(PROV[s.prov].name)} · ${esc(s.svc)} · via ${esc(s.via || 'CLI')}</div>`;
  h += `<div>${statusHTML(s)}</div>` + tagsHTML(s);
  if (s.status === 'waiting') h += gateButtons(s);
  if (s.askedBecause) h += sec('Why CloudBuddy asked', `<p>${esc(s.askedBecause)}</p>`, '', 'asked');
  if (s.generic) h += sec('How CloudBuddy read this', `<p>There's no ${esc(PROV[s.prov].name)} adapter yet, so CloudBuddy guessed from the command: the word “${esc(s.guessWord)}” means a change. The title is the agent's own description. Steps like this ask first unless they're clearly read-only.</p>`);
  h += sec('Why the agent did this', `<p>${esc(s.why)}</p>`);
  if (s.uses) h += sec('Uses', `<ul>${s.uses.map(u => `<li>The ${esc(u.what)} from step ${c.steps.findIndex(x => x.id === u.from) + 1}</li>`).join('')}</ul>`);
  if (s.loss) h += sec(s.status === 'waiting' ? esc(s.lossTitle || 'What will be lost') : 'What was at stake', `<ul>${s.loss.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`);
  if (s.approval) h += sec('Your decision', `<p>${s.approval.d === 'approve' ? 'Approved' : 'Denied'} by you at ${s.approval.at}.</p>`);
  if (s.facts) h += sec('Details', factsHTML(s.facts));
  h += sec(mcp ? 'Tool call' : 'Command', `<pre class="code" id="insCmd">${esc(s.cmd)}</pre>`, `<button type="button" class="copy" data-act="copy">${ic('copy','sm')}Copy</button>`);
  h += sec(mcp ? 'MCP tool' : 'API call', `<p class="mono">${esc(s.apiFull || s.api)}</p><p class="note">${mcp ? `The tool the agent called on the ${esc(PROV[s.prov].name)} MCP server.` : 'The operation behind this command.'}</p>`);
  h += sec('Output', s.out ? `<pre class="code">${esc(s.out)}</pre>${s.masked ? `<p class="note">${esc(s.masked)}</p>` : ''}` : '<p>Nothing yet. This step has not run.</p>');
  el.inspector.innerHTML = h;
  el.inspector.hidden = false;
}
function renderConnections(){
  const row = x => `<div class="conn-row ${x.rule === 'off' ? 'off' : ''}">
      <div class="conn-svc"><span class="mark">${esc(x.mark)}</span><div><b>${esc(x.name)}</b><span class="mono">${esc(x.how)}</span></div></div>
      <div class="cell"><span class="k">Signed in as</span><b>${esc(x.account)}</b><span>${esc(x.detail)}</span></div>
      <div class="cell"><span class="k">Adapter</span><span class="ad ad-${x.adapter}">${ADAPTER[x.adapter].label}</span><span>${esc(x.adNote || ADAPTER[x.adapter].note)}</span></div>
      <div class="cell"><label class="k" for="rule-${x.id}">Rule</label><select class="rule" id="rule-${x.id}" data-conn="${x.id}">${RULES.map(([v, l]) => `<option value="${v}"${v === x.rule ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    </div>`;
  el.connections.innerHTML = `<div class="conn-inner">
    <div class="conn-head">
      <div class="conn-head-text">
        <h2>Connections</h2>
        <p>Everything the agent can reach from this computer. CloudBuddy uses the logins already on your machine and never stores your keys.</p>
        <div class="conn-meta">${conns.cli.length} command-line tools · ${conns.mcp.length} MCP servers · checked at 20:30</div>
      </div>
      <button type="button" class="btn" id="scanBtn">${ic('reset','sm')}Scan again</button>
    </div>
    <div class="legend-grid">${Object.entries(ADAPTER).map(([k, a]) => `<div class="legend-item"><span class="ad ad-${k}">${a.label}</span>${esc(a.note)}</div>`).join('')}</div>
    <section class="conn-sec"><h3>Command-line tools <span>${conns.cli.length} found on your PATH</span></h3><div class="conn-list">${conns.cli.map(row).join('')}</div></section>
    <section class="conn-sec"><h3>MCP servers <span>${conns.mcp.length} set up in your agents</span></h3><div class="conn-list">${conns.mcp.map(row).join('')}</div></section>
    <div class="conn-foot">${ic('plug')}<p><b>Using a service that isn't listed?</b> If the agent can reach it through a CLI or an MCP server, CloudBuddy already records it with generic checks. Adding an adapter file makes its cards clearer.</p></div>
  </div>`;
}
function rerender(){
  renderSidebar(); renderChat(); renderHead(); renderCanvas(); renderScrubber();
  if (state.selected) renderInspector();
}
function refresh(c){ if (cur() === c) rerender(); else renderSidebar(); }

/* ---------- Camera ---------- */
let animTok = 0;
function animateTo(z, x, y, ms=480){
  const tok = ++animTok;
  if (reduced || ms === 0){ Object.assign(state, {zoom:z, panX:x, panY:y}); applyTransform(); return; }
  const z0 = state.zoom, x0 = state.panX, y0 = state.panY, t0 = performance.now();
  const step = t => {
    if (tok !== animTok) return;
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    state.zoom = z0 + (z - z0) * e; state.panX = x0 + (x - x0) * e; state.panY = y0 + (y - y0) * e;
    applyTransform();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function zoomAt(f, cx, cy){
  animTok++;
  const nz = clamp(state.zoom * f, .25, 2), k = nz / state.zoom;
  state.panX = cx - (cx - state.panX) * k; state.panY = cy - (cy - state.panY) * k; state.zoom = nz;
  applyTransform();
}
function fit(smooth=true){
  const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight; if (!vw) return;
  const z = clamp(Math.min((vw - 48) / state.worldW, (vh - 48) / state.worldH), .25, 1);
  animateTo(z, (vw - state.worldW * z) / 2, (vh - state.worldH * z) / 2, smooth ? 480 : 0);
}
function framing(id, z, xFrac){
  const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight, p = state.pos[id];
  const insOpen = !el.inspector.hidden;
  const insW = insOpen && !mobileMQ.matches ? 352 : 0;
  const insH = insOpen && mobileMQ.matches ? el.inspector.offsetHeight + 8 : 0;
  const x = (vw - insW) * xFrac - (p.x + CW / 2) * z;
  let y;
  if (state.worldH * z <= vh - insH - 32) y = (vh - insH - state.worldH * z) / 2;
  else y = clamp((vh - insH) / 2 - (p.y + p.h / 2) * z, vh - insH - state.worldH * z - 16, 16);
  return [x, y];
}
function initialView(smooth){
  const c = cur(), vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
  if (!vw || !state.worldW) return;
  if (Math.min((vw - 48) / state.worldW, (vh - 48) / state.worldH) >= .62){ fit(smooth); return; }
  const waiting = c.steps.find(s => s.status === 'waiting');
  const target = waiting ? waiting.id : (c.result && state.pos.result ? 'result' : c.steps[c.steps.length - 1].id);
  if (!state.pos[target]){ fit(smooth); return; }
  const z = mobileMQ.matches ? .74 : .86;
  const [x, y] = framing(target, z, mobileMQ.matches ? .5 : .66);
  animateTo(z, x, y, smooth ? 480 : 0);
}
function focusStep(id, {select=true, z=null, xFrac=.5}={}){
  if (!state.pos[id] && state.filter !== 'all') setFilter('all', false);
  if (!state.pos[id]) return;
  if (select){ state.selected = id; applyClasses(); renderInspector(); }
  const zz = z === null ? clamp(Math.max(state.zoom, .8), .25, 1.4) : z;
  const [x, y] = framing(id, zz, xFrac);
  animateTo(zz, x, y);
}
function follow(c, id){
  if (cur() !== c || state.page !== 'chat' || state.viewIndex !== null || state.playing || state.dirty) return;
  focusStep(id, {select:false, z:state.zoom, xFrac:mobileMQ.matches ? .5 : .6});
}

/* ---------- Actions ---------- */
function toast(msg){
  el.toast.textContent = msg; el.toast.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.toast.hidden = true; }, 2600);
}
function selectStep(id){
  if (id === 'result') return;
  state.selected = id; applyClasses(); renderInspector();
}
function closeInspector(){
  state.selected = null; el.inspector.hidden = true; applyClasses();
}
function setFilter(f, refocus=true){
  state.filter = f; renderHead(); renderCanvas();
  if (refocus) initialView(true);
}
function setPage(p){
  state.page = p; el.app.dataset.page = p;
  closeNav();
  if (p === 'connections'){ stopPlay(); renderConnections(); el.connections.scrollTop = 0; }
  renderSidebar();
  if (p === 'chat' && state.dirty && el.viewport.clientWidth){ renderCanvas(); initialView(false); }
}
function setView(v){
  if (state.page !== 'chat') setPage('chat');
  el.app.dataset.view = v;
  el.viewSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'canvas' && state.dirty){ renderCanvas(); initialView(false); }
  if (v === 'chat') el.messages.scrollTop = el.messages.scrollHeight;
}
function openNav(){ el.app.classList.add('nav-open'); el.scrim.hidden = false; }
function closeNav(){ el.app.classList.remove('nav-open'); el.scrim.hidden = true; }
function openConv(id){
  stopPlay(false);
  state.conv = id; state.selected = null; state.viewIndex = null; state.filter = 'all';
  el.inspector.hidden = true;
  const c = cur();
  state.seen = new Set(c.steps.map(s => s.id).concat(c.result ? ['result'] : []));
  if (state.page !== 'chat'){ state.page = 'chat'; el.app.dataset.page = 'chat'; }
  closeNav();
  rerender();
  initialView(false);
}
function showOnCanvas(id){
  if (mobileMQ.matches) setView('canvas');
  if (state.viewIndex !== null){ state.viewIndex = null; stopPlay(false); applyClasses(); renderScrubber(); }
  focusStep(id);
}
function decide(id, d){
  const c = convs.find(x => x.steps.some(s => s.id === id));
  const s = c && c.steps.find(x => x.id === id);
  if (!s || s.status !== 'waiting' || !c.flow) return;
  s.approval = {d, at:c.decideAt};
  c.flow(c, s, d);
}

/* Replay */
let playTimer = null;
function stopPlay(rerenderScrub=true){
  clearInterval(playTimer); playTimer = null;
  if (!state.playing) return;
  state.playing = false;
  if (rerenderScrub) renderScrubber();
}
function goTo(i){
  const c = cur();
  state.viewIndex = i >= c.steps.length - 1 ? null : i;
  applyClasses(); renderScrubber();
  focusStep(c.steps[i].id, {select:false, z:state.zoom, xFrac:.5});
}
function play(){
  if (state.playing){ stopPlay(); return; }
  closeInspector();
  state.playing = true;
  const c = cur();
  state.viewIndex = 0; applyClasses(); renderScrubber();
  focusStep(c.steps[0].id, {select:false, z:state.zoom, xFrac:.5});
  playTimer = setInterval(() => {
    if (state.viewIndex === null || state.viewIndex >= c.steps.length - 1){
      stopPlay(); state.viewIndex = null; applyClasses(); renderScrubber();
      if (c.result) focusStep('result', {select:false, z:state.zoom, xFrac:.5});
      return;
    }
    state.viewIndex++; applyClasses(); renderScrubber();
    focusStep(c.steps[state.viewIndex].id, {select:false, z:state.zoom, xFrac:.5});
  }, 1050);
}

/* ---------- Events ---------- */
el.recents.addEventListener('click', e => {
  const b = e.target.closest('[data-conv]'); if (b) openConv(b.dataset.conv);
});
el.nav.addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const k = b.dataset.nav;
  if (k === 'chats'){ setPage('chat'); return; }
  if (k === 'connections'){ setPage('connections'); return; }
  if (k === 'approvals'){
    const w = convs.find(c => c.steps.some(s => s.status === 'waiting'));
    if (!w){ toast('Nothing is waiting for your approval.'); return; }
    if (state.conv !== w.id) openConv(w.id); else setPage('chat');
    showOnCanvas(w.steps.find(s => s.status === 'waiting').id);
    return;
  }
  toast('Settings are not part of this mockup yet.');
});
$('#newChat').addEventListener('click', () => toast('New chats are not wired up in this mockup.'));
$('#resetBtn').addEventListener('click', () => {
  timers.forEach(clearTimeout); timers.length = 0;
  convs = seed(); conns = seedConnections();
  openConv('news'); toast('Demo reset.');
});
$('#menuBtn').addEventListener('click', openNav);
$('#menuBtn2').addEventListener('click', openNav);
el.scrim.addEventListener('click', closeNav);
el.viewSeg.addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });

el.messages.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act){ decide(act.dataset.id, act.dataset.act); return; }
  const st = e.target.closest('[data-step]');
  if (st) showOnCanvas(st.dataset.step);
});
el.composer.addEventListener('submit', e => {
  e.preventDefault();
  const v = el.input.value.trim(); if (!v) return;
  const c = cur();
  c.chat.push({t:'user', text:v}); el.input.value = ''; renderChat();
  later(700, () => {
    c.chat.push({t:'agent', text:`This is a mockup, so nothing runs here. In the real app, ${c.agent} would pick up your message and every step it takes would land on the canvas.`});
    if (cur() === c) renderChat();
  });
});
el.input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); el.composer.requestSubmit(); }
});

el.connections.addEventListener('change', e => {
  const sel = e.target.closest('select[data-conn]'); if (!sel) return;
  const x = conns.cli.concat(conns.mcp).find(k => k.id === sel.dataset.conn); if (!x) return;
  x.rule = sel.value;
  sel.closest('.conn-row').classList.toggle('off', x.rule === 'off');
  toast(`${x.name}: rule saved. It applies from the next step.`);
});
el.connections.addEventListener('click', e => {
  if (e.target.closest('#scanBtn')) toast(`Scanned. ${conns.cli.length} tools and ${conns.mcp.length} MCP servers found.`);
});

el.filterSeg.addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b && b.dataset.filter !== state.filter) setFilter(b.dataset.filter); });
$('#zoomIn').addEventListener('click', () => zoomAt(1.2, el.viewport.clientWidth / 2, el.viewport.clientHeight / 2));
$('#zoomOut').addEventListener('click', () => zoomAt(1 / 1.2, el.viewport.clientWidth / 2, el.viewport.clientHeight / 2));
$('#fitBtn').addEventListener('click', () => fit(true));

el.nodes.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) decide(act.dataset.id, act.dataset.act);
});
el.nodes.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (card && e.target === card){ e.preventDefault(); selectStep(card.dataset.id); }
});
el.inspector.addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'close') closeInspector();
  else if (a === 'copy'){
    const s = cur().steps.find(x => x.id === state.selected); if (!s) return;
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents($('#insCmd'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast('Selected. Press ⌘C to copy.');
    };
    try { navigator.clipboard.writeText(s.cmd).then(() => toast('Copied.'), fallback); } catch (err) { fallback(); }
  }
  else decide(act.dataset.id, a);
});
el.playBtn.addEventListener('click', play);
el.liveBtn.addEventListener('click', () => {
  stopPlay(false); state.viewIndex = null; applyClasses(); renderScrubber();
  const c = cur(), last = c.result ? 'result' : c.steps[c.steps.length - 1].id;
  focusStep(last, {select:false, z:state.zoom, xFrac:.5});
});
el.ticks.addEventListener('click', e => {
  const t = e.target.closest('[data-i]'); if (!t) return;
  stopPlay(false); goTo(+t.dataset.i);
});

/* Pan and zoom */
el.viewport.addEventListener('wheel', e => {
  if (e.target.closest('.inspector')) return;
  e.preventDefault();
  const r = el.viewport.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
  else { animTok++; state.panX -= e.deltaX; state.panY -= e.deltaY; applyTransform(); }
}, {passive:false});
const ptrs = new Map();
let drag = null, pinch = null;
el.viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (e.target.closest('button, .inspector, a, input, textarea, select')) return;
  el.viewport.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  animTok++;
  if (ptrs.size === 1) drag = {sx:e.clientX, sy:e.clientY, px:state.panX, py:state.panY, moved:false, card:e.target.closest('.card')};
  else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), z:state.zoom}; drag = null;
  }
});
el.viewport.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()], r = el.viewport.getBoundingClientRect();
    const target = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, .25, 2);
    zoomAt(target / state.zoom, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (drag){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 4){ drag.moved = true; el.viewport.classList.add('grabbing'); }
    if (drag.moved){ state.panX = drag.px + dx; state.panY = drag.py + dy; applyTransform(); }
  }
});
function endPointer(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && !drag.moved && e.type === 'pointerup'){
    if (drag.card) selectStep(drag.card.dataset.id);
    else if (!el.inspector.hidden) closeInspector();
  }
  drag = null;
  if (ptrs.size < 2) pinch = null;
  el.viewport.classList.remove('grabbing');
}
el.viewport.addEventListener('pointerup', endPointer);
el.viewport.addEventListener('pointercancel', endPointer);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!el.inspector.hidden) closeInspector(); closeNav(); }
});
let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    if (state.dirty && el.viewport.clientWidth){ renderCanvas(); initialView(false); }
    else applyTransform();
    if (window.innerWidth > 1100) closeNav();
  }, 80);
});

/* ---------- Boot ---------- */
state.seen = new Set(cur().steps.map(s => s.id));
rerender();
initialView(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.page === 'chat'){ renderCanvas(); initialView(false); } });
})();
</script>
